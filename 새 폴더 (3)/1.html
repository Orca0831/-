<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>subject1</title>
        <style>
            * {
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }

            html, body {
                height: 100%;
            }

            .container {
                display: flex;
                align-items: stretch;
                min-height: 100vh;
            }

            aside {
                width: 350px;
                background-color: #fff;
                border-right: 1px solid #ddd;
            }

            .logo {
                display: flex;
                align-items: center;
                padding: 20px;
                gap: 3px;
            }

            .aside-icon {
                width: 45px;
                height: 45px;
                background-color: rgb(8, 68, 0);
                margin: 5px;
                border-radius: 8px;
                display: flex;
            }

            .logo-text {
                font-size: 22px;
                font-weight: bold;
                color: rgb(0, 0, 0);
            }

            .menu {
                display: flex;
                flex-direction: column;
                padding: 10px;
                margin-left: 10px;
                margin-top: 5px;
                gap: 5px;
                font-size: 22px ;
                color: #505453;
            }

            .menu-item {
                padding: 10px;
                cursor: pointer;
                border-radius: 10px;
            }

            .menu-item:nth-child(1) {
                background-color: #e8f0f0;
                color: black;
            }

            .tags {
                display: flex;
                margin-top: 30px;
                padding-left: 30px;
                flex-direction: column;
                color: #505453;
            }

            .t {
                margin-bottom: 20px;
            }

            .tags-item {
                display: flex;
                flex-direction: column;;
            }

            .tag {  
                display: flex;
                gap: 10px;
                margin-bottom: 10px;
                font-size: 22px;
                width: 300px;
                align-items: center;
            }

            /*ai 도움받음. 왼쪽 체크박스 빈공간 클릭 시 체크 되도록*/
            .tag label {
                flex: 1;
                cursor: pointer;
                display: block;
                padding: 5px;
            }

            .num {
                background-color: #d1e7e7;
                border-radius: 50%;
                width: 30px;
                height: 30px;
                padding: 4px 11px;
                font-size: 15px;
                color: #505453;
            }

            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background-color: #fff;
                width: auto;
                height: 100px;
                border-bottom: 1px solid #ddd;
                padding-left: 30px;
            }
            
            .search {
                width: 300px;
            }

            .search input {
                width: 100%;
                height: 50px;
                border: 1px solid #505453;
                border-radius: 8px;
                padding: 10px 20px;
                font-size: 14px;
                margin-left: 30px;
                font-size: 18px;
            }

            .right-menu {
                display: flex;
            }

            .add-bookmark {
                display: flex;
                align-items: center;
                width: 200px;
                height: 50px;
                background-color: #024744;
                color: white;
                border-radius: 8px;
                padding-left: 20px;
                font-size: 20px;
                margin-right: 20px;
            }

            .image {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background-color: black;
                margin-right: 50px;
            }

            main {
                flex: 1;
                background-color: #e8f0f0;
                color: black;
            }

            .bookmark-top {
                display: flex;
                justify-content: space-between;
            }

            .bookmark-title {
                margin: 50px 40px;
            }

            .sort {
                display: flex;
                align-items: center;
                margin: 50px 50px 0px 0px;
                font-size: 20px;
                width: 140px;
                height: 55px;
                background-color: white;
                border-radius: 8px;
                border: 1px solid black;
                padding-left: 10px;
            }

            .bookmark {
                margin: 0px 50px 50px 40px;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                grid-auto-rows: 400px;
            }

            .bookmark-grid {
                border: 1px solid #000;
                border-radius: 8px;
                background-color: white;
            }

        </style>
    </head>
    <body>
        <div class="container">
            <aside>
                <div class="logo">
                    <div class="aside-icon"></div>
                    <div class="logo-text">Bookmark Manager</div>
                </div>

                <div class="menu">
                    <div class="menu-item">Home</div>
                    <div class="menu-item">Archived</div>
                </div>

                <div class="tags">
                    <div class="t">
                        <h4><b>Tags</b></h4>
                    </div>
                    <div class="tags-item">
                        <div class="tag"> <input type="checkbox" id="ai"> <label for="ai">AI</label> <div class="num">1</div> </div>
                        <div class="tag"> <input type="checkbox" id="community"> <label for="community">Community</label> <div class="num">5</div> </div>
                        <div class="tag"> <input type="checkbox" id="compatibility"> <label for="compatibility">Compatibility</label> <div class="num">1</div> </div>
                        <div class="tag"> <input type="checkbox" id="css"> <label for="css">CSS</label> <div class="num">6</div> </div>
                        <div class="tag"> <input type="checkbox" id="design"> <label for="design">Design</label> <div class="num">1</div> </div>
                        <div class="tag"> <input type="checkbox" id="framework"> <label for="framework">Framework</label> <div class="num">2</div> </div>
                        <div class="tag"> <input type="checkbox" id="git"> <label for="git">Git</label> <div class="num">1</div> </div>
                        <div class="tag"> <input type="checkbox" id="html"> <label for="html">HTML</label> <div class="num">2</div> </div>
                        <div class="tag"> <input type="checkbox" id="javascript"> <label for="javascript">JavaScript</label> <div class="num">3</div> </div>
                        <div class="tag"> <input type="checkbox" id="layout"> <label for="layout">Layout</label> <div class="num">3</div> </div>
                        <div class="tag"> <input type="checkbox" id="learning"> <label for="learning">Learning</label> <div class="num">6</div> </div>
                        <div class="tag"> <input type="checkbox" id="performance"> <label for="performance">Performance</label> <div class="num">2</div> </div>
                        <div class="tag"> <input type="checkbox" id="practice"> <label for="practice">Practice</label> <div class="num">5</div> </div>
                        <div class="tag"> <input type="checkbox" id="reference"> <label for="reference">Reference</label> <div class="num">4</div> </div>
                        <div class="tag"> <input type="checkbox" id="tips"> <label for="tips">Tips</label> <div class="num">4</div> </div>
                        <div class="tag"> <input type="checkbox" id="tools"> <label for="tools">Tools</label> <div class="num">4</div> </div>
                        <div class="tag"> <input type="checkbox" id="tutorial"> <label for="tutorial">Tutorial</label> <div class="num">3</div> </div>
                    </div>
                </div>
            </aside>
            
            <main>
                <header>
                    <div class="search"><input type="text" placeholder="Q Search by title..."></div>
                    <div class="right-menu">
                        <div class="add-bookmark">+ Add Bookmark</div>
                        <div class="image"></div>
                    </div>
                </header>

                <div class="content">
                    <div class="bookmark-top">
                        <div class="bookmark-title"><h1>All Bookmarks</h1></div>
                        <div class="sort"><b>↑↓ Sort by</b></div>
                    </div>

                    <div class="bookmark">
                        <div class="bookmark-grid"></div>
                        <div class="bookmark-grid"></div>
                        <div class="bookmark-grid"></div>
                        <div class="bookmark-grid"></div>
                        <div class="bookmark-grid"></div>
                        <div class="bookmark-grid"></div>
                        <div class="bookmark-grid"></div>
                        <div class="bookmark-grid"></div>
                        <div class="bookmark-grid"></div>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
